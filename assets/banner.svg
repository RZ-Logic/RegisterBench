<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="100%" role="img" aria-labelledby="banner-title banner-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="banner-title">RegisterBench</title>
  <desc id="banner-desc">RegisterBench: independent, cross-tool, register-split measurement of anti-AI-slop rulesets. Recall on manually seeded ground truth, flag behavior on verifiably pre-ChatGPT human text, split by writing register. It measures rules, not writers.</desc>

  <rect width="1280" height="360" fill="#0B1220"/>

  <g opacity="0.06" stroke="#94A3B8" stroke-width="0.5">
    <line x1="0" y1="80"  x2="1280" y2="80"/>
    <line x1="0" y1="280" x2="1280" y2="280"/>
  </g>

  <text x="80" y="116" font-size="56" font-weight="500" fill="#F8FAFC" letter-spacing="-0.5">RegisterBench</text>

  <text x="80" y="160" font-size="20" font-weight="400" fill="#CBD5E1" letter-spacing="0.1">Independent, cross-tool, register-split measurement of anti-AI-slop rulesets.</text>

  <text x="80" y="186" font-size="13" font-weight="400" fill="#64748B" letter-spacing="0.2">It measures rules, not writers.</text>

  <line x1="170" y1="236" x2="1110" y2="236" stroke="#334155" stroke-width="0.5" stroke-dasharray="2 4"/>

  <g font-size="11" font-weight="500" letter-spacing="0.2">
    <g>
      <rect x="170" y="210" width="88" height="52" rx="6" fill="none" stroke="#475569" stroke-width="0.75"/>
      <text x="214" y="241" fill="#CBD5E1" text-anchor="middle">corpus</text>
    </g>
    <g>
      <rect x="272" y="210" width="88" height="52" rx="6" fill="none" stroke="#475569" stroke-width="0.75"/>
      <text x="316" y="241" fill="#CBD5E1" text-anchor="middle">seed</text>
    </g>
    <g>
      <rect x="374" y="210" width="88" height="52" rx="6" fill="none" stroke="#475569" stroke-width="0.75"/>
      <text x="418" y="241" fill="#CBD5E1" text-anchor="middle">crosswalk</text>
    </g>
    <g>
      <rect x="476" y="210" width="132" height="52" rx="6" fill="none" stroke="#D97706" stroke-width="1"/>
      <text x="542" y="235" fill="#FBBF24" text-anchor="middle">detect</text>
      <text x="542" y="251" font-size="9" font-weight="400" fill="#A16207" text-anchor="middle">6 tools, 2 tracks</text>
    </g>
    <g>
      <rect x="622" y="210" width="88" height="52" rx="6" fill="none" stroke="#475569" stroke-width="0.75"/>
      <text x="666" y="241" fill="#CBD5E1" text-anchor="middle">match</text>
    </g>
    <g>
      <rect x="724" y="210" width="88" height="52" rx="6" fill="none" stroke="#475569" stroke-width="0.75"/>
      <text x="768" y="241" fill="#CBD5E1" text-anchor="middle">score</text>
    </g>
    <g>
      <rect x="826" y="210" width="284" height="52" rx="6" fill="none" stroke="#475569" stroke-width="0.75"/>
      <text x="968" y="235" fill="#CBD5E1" text-anchor="middle">recall  ·  flags/1k  ·  term-of-art rate</text>
      <text x="968" y="251" font-size="9" font-weight="400" fill="#64748B" text-anchor="middle">per tool, per tier, per pattern</text>
    </g>
  </g>

  <g font-size="11" font-weight="400" fill="#475569" letter-spacing="0.3">
    <text x="170" y="300">Deterministic corpus, manifest, matching, and scoring. One stochastic detection stage, bounded at N=3.</text>
  </g>

  <g font-size="10" font-weight="400" fill="#334155" letter-spacing="0.4">
    <text x="1110" y="300" text-anchor="end">finance-audit shipped  ·  casual-email, social, technical-docs planned</text>
  </g>
</svg>
