name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify the seeded ground truth
        run: python scripts/verify_manifest.py finance-audit
      - name: Run the offline test suite (mocked API, no network, no key)
        run: python -m unittest discover -s tests -v
